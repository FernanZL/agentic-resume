# Local stack: Postgres, the API with hot reload, and the Vite dev server.
# http://localhost:5173 (web) · http://localhost:8000/docs (API)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic
      POSTGRES_DB: agentic
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: { context: ., target: dev }
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://agentic:agentic@db:5432/agentic
    ports: ["8000:8000"]
    volumes:
      - ./agent:/app/agent
      - ./backend:/app/backend
    depends_on:
      db: { condition: service_healthy }

  web:
    image: node:26-slim
    working_dir: /web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://api:8000
    ports: ["5173:5173"]
    volumes:
      - ./web:/web
      - web_node_modules:/web/node_modules
    depends_on: [api]

volumes:
  pgdata:
  web_node_modules:
