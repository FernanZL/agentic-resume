# Render Blueprint: one Docker web service (API + built web app). Postgres is external
# (Supabase free tier: Render's free Postgres expires after 30 days). Secrets are set
# in the dashboard (sync: false).
services:
  - type: web
    name: agentic-resume
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL # Supabase session pooler URL (port 5432)
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: DEMO_PASSCODE
        sync: false
      - key: MAX_DAILY_COST_USD
        value: "2"
      - key: MODEL_DEFAULT
        value: openai/gpt-6-luna
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        sync: false
